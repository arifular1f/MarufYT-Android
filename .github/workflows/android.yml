name: Android foundation
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate structure and secret guard
        run: python tools/validate_foundation.py
      - name: Install host validation dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate published fingerprint metadata
        run: python tools/apk-analysis/validate_fingerprints.py Documentation/PHASE2B_FINGERPRINT_INVENTORY.json
      - name: Run foundation and synthetic APK analysis tests
        run: python -m unittest discover -s tests -v
      - name: Run JVM tests and build debug APK
        run: bash gradlew test assembleDebug lintDebug --stacktrace --console=plain
      - name: Verify debug APK signature
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MarufYT-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Generate debug checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload debug verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: MarufYT-debug-checksums
          path: app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Report failure
        if: failure()
        run: echo '::error::Foundation build failed. Inspect the first failed step and available build-diagnostics artifact.'
